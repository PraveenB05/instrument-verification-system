# ===================================================================
# SIH26036 - Online Weighing & Measuring Instrument Verification
# Spring Boot Configuration
# ===================================================================

server.port=8080
spring.application.name=instrument-verification-system

# Disable automatic SQL script initialization (JPA and DataInitializer handle table creation and demo seeding)
spring.sql.init.mode=never

# -------------------------------------------------------------------
# OPTION 1: In-Memory H2 Database (Active by default for Zero-Setup Demo)
# To test immediately without configuring PostgreSQL, keep these active:
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:sih_instruments;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# OPTION 2: PostgreSQL Configuration
# To use PostgreSQL, comment out the H2 lines above and uncomment below:
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/instrument_verification_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Error Handling Configuration
server.error.include-message=always
server.error.include-exception=true

# Public Verification URL Base (used when embedding URL in QR Code)
app.verification.base-url=http://localhost:5173/verify/
